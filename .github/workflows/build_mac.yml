name: Compilar App para macOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pyinstaller

    - name: Compilar o aplicativo (.app)
      run: |
        pyinstaller --noconfirm --onedir --windowed SalesProj.py

    - name: Compactar o App em ZIP
      run: |
        cd dist
        zip -r "../GerenciadorDeVendas-macOS.zip" SalesProj.app

    - name: Salvar o executável para Download (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: GerenciadorDeVendas-macOS
        path: GerenciadorDeVendas-macOS.zip